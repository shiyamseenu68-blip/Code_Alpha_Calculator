<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Modern Calculator | All Operations</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      padding: 1rem;
    }

    .calculator {
      background: rgba(22, 22, 40, 0.85);
      backdrop-filter: blur(24px);
      border-radius: 2.5rem;
      padding: 2rem 1.8rem 2.2rem;
      box-shadow: 
        0 40px 70px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -2px 0 rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.12);
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      transition: transform 0.2s ease;
    }

    .calculator:hover {
      transform: translateY(-2px);
    }

    /* Display Screen */
    .display-container {
      background: #0a0a16;
      border-radius: 1.8rem;
      padding: 1.5rem 1.4rem;
      box-shadow: 
        inset 0 4px 8px rgba(0, 0, 0, 0.6),
        0 2px 4px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .expression {
      color: #7b8ca0;
      font-size: 1rem;
      min-height: 1.5rem;
      text-align: right;
      letter-spacing: 0.5px;
      font-weight: 400;
      word-wrap: break-word;
      overflow-wrap: break-word;
      margin-bottom: 0.3rem;
      transition: color 0.2s;
    }

    .result {
      color: #f0f4ff;
      font-size: 2.8rem;
      font-weight: 600;
      text-align: right;
      letter-spacing: 1px;
      word-wrap: break-word;
      overflow-wrap: break-word;
      line-height: 1.2;
      transition: all 0.15s ease;
      min-height: 3.4rem;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
    }

    /* Button Grid */
    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.8rem;
    }

    button {
      background: rgba(30, 34, 52, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.2rem;
      color: #e8edf5;
      font-size: 1.4rem;
      font-weight: 500;
      padding: 1.1rem 0.5rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.4, 1);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    button:active {
      transform: scale(0.93);
      background: rgba(50, 55, 80, 0.8);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    button:hover {
      background: rgba(45, 50, 72, 0.8);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

    /* Operator buttons */
    .operator {
      background: rgba(70, 60, 130, 0.65);
      color: #c4b5fd;
      font-weight: 600;
      border-color: rgba(180, 160, 255, 0.25);
    }

    .operator:hover {
      background: rgba(100, 85, 175, 0.7);
      color: #e0d5ff;
    }

    /* Equals button */
    .equals {
      background: linear-gradient(135deg, #6d5acb, #4f3db0);
      color: white;
      font-weight: 700;
      border-color: rgba(200, 180, 255, 0.4);
      grid-column: span 2;
    }

    .equals:hover {
      background: linear-gradient(135deg, #7e6cdb, #5e4cc0);
      box-shadow: 0 8px 22px rgba(110, 90, 200, 0.5);
    }

    /* Clear and delete buttons */
    .clear-btn {
      background: rgba(180, 70, 70, 0.5);
      color: #ffb8b8;
      font-weight: 600;
      border-color: rgba(255, 140, 140, 0.25);
    }

    .clear-btn:hover {
      background: rgba(200, 80, 80, 0.6);
      color: #ffd0d0;
    }

    .delete-btn {
      background: rgba(160, 120, 60, 0.45);
      color: #ffdba8;
      font-weight: 600;
      border-color: rgba(255, 200, 130, 0.25);
    }

    .delete-btn:hover {
      background: rgba(180, 135, 70, 0.55);
    }

    /* Zero button */
    .zero {
      grid-column: span 2;
    }

    /* Responsive adjustments */
    @media (max-width: 400px) {
      .calculator {
        padding: 1.5rem 1.2rem 1.8rem;
        gap: 1.2rem;
      }
      button {
        font-size: 1.2rem;
        padding: 0.9rem 0.3rem;
        border-radius: 1rem;
      }
      .result {
        font-size: 2.3rem;
      }
      .buttons-grid {
        gap: 0.6rem;
      }
    }

    /* Keyboard focus indicator */
    button:focus-visible {
      outline: 2px solid #a78bfa;
      outline-offset: 3px;
    }

    /* Subtle ripple effect */
    button::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.3s;
    }

    button:active::after {
      opacity: 1;
      transition: 0s;
    }
  </style>
</head>
<body>
  <div class="calculator" role="application" aria-label="Calculator">
    <!-- Display Screen -->
    <div class="display-container">
      <div class="expression" id="expression" aria-label="Expression preview"></div>
      <div class="result" id="result" aria-live="polite" aria-label="Current result">0</div>
    </div>

    <!-- Buttons Grid -->
    <div class="buttons-grid">
      <!-- Row 1: Clear, Delete, etc. -->
      <button class="clear-btn" data-action="clear" aria-label="Clear all">AC</button>
      <button class="delete-btn" data-action="delete" aria-label="Delete last character">⌫</button>
      <button class="operator" data-action="operator" data-value="%" aria-label="Percentage">%</button>
      <button class="operator" data-action="operator" data-value="/" aria-label="Divide">÷</button>

      <!-- Row 2 -->
      <button data-action="number" data-value="7" aria-label="Seven">7</button>
      <button data-action="number" data-value="8" aria-label="Eight">8</button>
      <button data-action="number" data-value="9" aria-label="Nine">9</button>
      <button class="operator" data-action="operator" data-value="*" aria-label="Multiply">×</button>

      <!-- Row 3 -->
      <button data-action="number" data-value="4" aria-label="Four">4</button>
      <button data-action="number" data-value="5" aria-label="Five">5</button>
      <button data-action="number" data-value="6" aria-label="Six">6</button>
      <button class="operator" data-action="operator" data-value="-" aria-label="Subtract">−</button>

      <!-- Row 4 -->
      <button data-action="number" data-value="1" aria-label="One">1</button>
      <button data-action="number" data-value="2" aria-label="Two">2</button>
      <button data-action="number" data-value="3" aria-label="Three">3</button>
      <button class="operator" data-action="operator" data-value="+" aria-label="Add">+</button>

      <!-- Row 5 -->
      <button class="zero" data-action="number" data-value="0" aria-label="Zero">0</button>
      <button data-action="number" data-value="." aria-label="Decimal point">.</button>
      <button class="equals" data-action="calculate" aria-label="Equals">=</button>
    </div>
  </div>

  <script>
    (function() {
      // DOM Elements
      const expressionDisplay = document.getElementById('expression');
      const resultDisplay = document.getElementById('result');
      const buttons = document.querySelectorAll('button');

      // Calculator State
      let currentInput = '0';
      let previousInput = '';
      let operator = null;
      let shouldResetScreen = false;
      let lastResult = null;

      // ---- Display Update Functions ----
      function updateDisplay() {
        resultDisplay.textContent = currentInput;
        
        // Build expression preview
        if (operator && previousInput) {
          const opSymbol = getOperatorSymbol(operator);
          expressionDisplay.textContent = `${previousInput} ${opSymbol}`;
        } else if (lastResult && !operator) {
          expressionDisplay.textContent = `= ${lastResult}`;
        } else {
          expressionDisplay.textContent = '';
        }
      }

      function getOperatorSymbol(op) {
        const symbols = {
          '+': '+',
          '-': '−',
          '*': '×',
          '/': '÷',
          '%': '%'
        };
        return symbols[op] || op;
      }

      // ---- Input Handling ----
      function inputNumber(number) {
        if (shouldResetScreen) {
          currentInput = number;
          shouldResetScreen = false;
        } else {
          // Prevent multiple leading zeros
          if (currentInput === '0' && number !== '.') {
            currentInput = number;
          } else if (currentInput === '0' && number === '.') {
            currentInput = '0.';
          } else if (number === '.' && currentInput.includes('.')) {
            return; // Prevent multiple decimals
          } else {
            currentInput += number;
          }
        }
        updateDisplay();
      }

      function inputOperator(nextOperator) {
        // Handle percentage immediately
        if (nextOperator === '%') {
          if (currentInput !== '0') {
            currentInput = (parseFloat(currentInput) / 100).toString();
            updateDisplay();
          }
          return;
        }

        const inputValue = parseFloat(currentInput);

        // If we already have a pending operation
        if (operator && previousInput && !shouldResetScreen) {
          const result = calculate(parseFloat(previousInput), inputValue, operator);
          currentInput = formatResult(result);
          previousInput = currentInput;
          lastResult = currentInput;
        } else {
          previousInput = currentInput;
        }

        operator = nextOperator;
        shouldResetScreen = true;
        updateDisplay();
      }

      function calculate(a, b, op) {
        switch (op) {
          case '+':
            return a + b;
          case '-':
            return a - b;
          case '*':
            return a * b;
          case '/':
            return b !== 0 ? a / b : 'Error';
          case '%':
            return a % b;
          default:
            return b;
        }
      }

      function formatResult(number) {
        if (number === 'Error') return 'Error';
        // Handle floating point precision
        const rounded = Math.round(number * 1000000) / 1000000;
        // Limit display length
        const str = rounded.toString();
        if (str.length > 12) {
          return rounded.toExponential(6);
        }
        return str;
      }

      function performCalculation() {
        if (!operator || shouldResetScreen) {
          // If no operator, just show current input
          updateDisplay();
          return;
        }

        const currentValue = parseFloat(currentInput);
        const previousValue = parseFloat(previousInput);
        
        if (isNaN(previousValue) || isNaN(currentValue)) {
          return;
        }

        const result = calculate(previousValue, currentValue, operator);
        currentInput = formatResult(result);
        lastResult = currentInput;
        operator = null;
        previousInput = '';
        shouldResetScreen = true;
        updateDisplay();
      }

      function clearAll() {
        currentInput = '0';
        previousInput = '';
        operator = null;
        shouldResetScreen = false;
        lastResult = null;
        updateDisplay();
      }

      function deleteLast() {
        if (shouldResetScreen) return;
        
        if (currentInput.length > 1) {
          currentInput = currentInput.slice(0, -1);
        } else {
          currentInput = '0';
        }
        
        // Handle negative numbers
        if (currentInput === '-') {
          currentInput = '0';
        }
        
        updateDisplay();
      }

      function handlePercentage() {
        if (currentInput !== '0') {
          currentInput = (parseFloat(currentInput) / 100).toString();
          updateDisplay();
        }
      }

      // ---- Button Click Handler ----
      buttons.forEach(button => {
        button.addEventListener('click', (e) => {
          const action = button.dataset.action;
          const value = button.dataset.value;

          // Add ripple effect
          addRipple(e, button);

          switch (action) {
            case 'number':
              inputNumber(value);
              break;
            case 'operator':
              inputOperator(value);
              break;
            case 'calculate':
              performCalculation();
              break;
            case 'clear':
              clearAll();
              break;
            case 'delete':
              deleteLast();
              break;
          }
        });
      });

      // ---- Ripple Effect ----
      function addRipple(event, button) {
        const ripple = document.createElement('span');
        const rect = button.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = event.clientX - rect.left - size / 2;
        const y = event.clientY - rect.top - size / 2;
        
        ripple.style.cssText = `
          position: absolute;
          width: ${size}px;
          height: ${size}px;
          left: ${x}px;
          top: ${y}px;
          background: rgba(255, 255, 255, 0.3);
          border-radius: 50%;
          transform: scale(0);
          animation: ripple 0.6s ease-out;
          pointer-events: none;
        `;
        
        button.appendChild(ripple);
        
        ripple.addEventListener('animationend', () => {
          ripple.remove();
        });
      }

      // Add ripple animation keyframes
      const style = document.createElement('style');
      style.textContent = `
        @keyframes ripple {
          to {
            transform: scale(4);
            opacity: 0;
          }
        }
      `;
      document.head.appendChild(style);

      // ---- Keyboard Support ----
      document.addEventListener('keydown', (e) => {
        const key = e.key;
        
        // Prevent default for calculator keys
        if (
          (key >= '0' && key <= '9') ||
          key === '.' ||
          key === '+' ||
          key === '-' ||
          key === '*' ||
          key === '/' ||
          key === '%' ||
          key === 'Enter' ||
          key === 'Escape' ||
          key === 'Backspace' ||
          key === '='
        ) {
          e.preventDefault();
        }

        // Numbers
        if (key >= '0' && key <= '9') {
          inputNumber(key);
        }
        // Decimal point
        else if (key === '.') {
          inputNumber('.');
        }
        // Operators
        else if (key === '+') {
          inputOperator('+');
        }
        else if (key === '-') {
          inputOperator('-');
        }
        else if (key === '*') {
          inputOperator('*');
        }
        else if (key === '/') {
          inputOperator('/');
        }
        else if (key === '%') {
          inputOperator('%');
        }
        // Calculate
        else if (key === 'Enter' || key === '=') {
          performCalculation();
        }
        // Clear
        else if (key === 'Escape') {
          clearAll();
        }
        // Delete
        else if (key === 'Backspace') {
          deleteLast();
        }

        // Add visual feedback for keyboard
        highlightKeyButton(key);
      });

      // Highlight corresponding button when key is pressed
      function highlightKeyButton(key) {
        let targetButton = null;
        
        // Map keyboard keys to button data attributes
        const keyMap = {
          '0': '[data-value="0"]',
          '1': '[data-value="1"]',
          '2': '[data-value="2"]',
          '3': '[data-value="3"]',
          '4': '[data-value="4"]',
          '5': '[data-value="5"]',
          '6': '[data-value="6"]',
          '7': '[data-value="7"]',
          '8': '[data-value="8"]',
          '9': '[data-value="9"]',
          '.': '[data-value="."]',
          '+': '[data-value="+"]',
          '-': '[data-value="-"]',
          '*': '[data-value="*"]',
          '/': '[data-value="/"]',
          '%': '[data-value="%"]',
          'Enter': '[data-action="calculate"]',
          '=': '[data-action="calculate"]',
          'Escape': '[data-action="clear"]',
          'Backspace': '[data-action="delete"]'
        };

        const selector = keyMap[key];
        if (selector) {
          targetButton = document.querySelector(selector);
        }

        if (targetButton) {
          targetButton.style.transform = 'scale(0.93)';
          targetButton.style.background = 'rgba(80, 85, 120, 0.8)';
          
          setTimeout(() => {
            targetButton.style.transform = '';
            targetButton.style.background = '';
          }, 150);
        }
      }

      // Initialize display
      updateDisplay();

      // Add touch support for mobile
      document.addEventListener('touchstart', function(e) {
        if (e.target.tagName === 'BUTTON') {
          e.target.click();
        }
      }, { passive: true });

      console.log('✅ Calculator ready! Keyboard shortcuts:');
      console.log('• Numbers: 0-9');
      console.log('• Operators: +, -, *, /');
      console.log('• Calculate: Enter or =');
      console.log('• Clear: Escape');
      console.log('• Delete: Backspace');
      console.log('• Decimal: .');
    })();
  </script>
</body>
</html>
